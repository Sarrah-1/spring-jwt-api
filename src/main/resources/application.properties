spring.application.name=spring-jwt-api

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/security_jwt?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Configuration JWT ---
# Secret : au moins 32 caracteres pour HS256. En production, le definir via la variable d'environnement JWT_SECRET.
jwt.secret=${JWT_SECRET:MySuperSecretKeyForJwtAuthentication123456}
# Duree de validite du token en millisecondes (3600000 = 1 heure)
jwt.expiration=3600000
